version: '3.8'

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: osticket_user
      MYSQL_PASSWORD: osticket_password
      MYSQL_DATABASE: osticket_db
    volumes:
      - db_data:/var/lib/mysql

  osticket:
    image: campbellsoftwaresolutions/osticket:latest
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: osticket_user
      MYSQL_PASSWORD: osticket_password
      MYSQL_DATABASE: osticket_db
    depends_on:
      - db
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-6.4-latest
    environment:
      DB_SERVER_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
    ports:
      - "10051:10051"
    depends_on:
      - db
  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:alpine-6.4-latest
    ports:
      - "8081:8080"
    environment:
      DB_SERVER_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: root_password
      ZBX_SERVER_HOST: zabbix-server
    depends_on:
      - db
      - zabbix-server

volumes:
  db_data:
